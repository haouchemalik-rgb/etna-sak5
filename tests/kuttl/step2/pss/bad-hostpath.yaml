apiVersion: v1
kind: Pod
metadata:
  name: bad-hostpath
  namespace: app
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: v
      hostPath:
        path: /etc
  containers:
    - name: c
      image: nginx:1.25
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
      volumeMounts:
        - name: v
          mountPath: /mnt