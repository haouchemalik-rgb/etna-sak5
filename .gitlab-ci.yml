stages:
  - validate
  - security-scan
  - test


build-image:
  stage: validate
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "=== build & push image ==="
    - docker login registry.gitlab.com -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker build -t "$CI_REGISTRY_IMAGE/orders-api:1.0.0" .
    - docker push "$CI_REGISTRY_IMAGE/orders-api:1.0.0"
  tags:
    - SAK5
  only:
    - main


validate-manifests:
  stage: validate
  image: alpine:3.19
  script:
    - echo "=== validate manifests ==="
    - test -d lab/a-admission || exit 1
    - test -d lab/d-messaging || exit 1
    - test -d policies/admission || exit 1
    - test -f lab/a-admission/orders-api-worker.yaml || exit 1
    - echo "manifests validation ok"
  tags:
    - SAK5
  only:
    - main

validate-scripts:
  stage: validate
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash
  script:
    - echo "=== validate scripts ==="
    - bash -n scripts/*.sh || exit 1
    - echo "scripts validation ok"
  tags:
    - SAK5
  only:
    - main

validate-kyverno-policies:
  stage: validate
  image: alpine:3.19
  script:
    - echo "=== validate kyverno policies ==="
    - test -f policies/admission/deny-privileged.yaml || exit 1
    - test -f policies/admission/deny-hostpath.yaml || exit 1
    - test -f policies/admission/deny-latest-tag.yaml || exit 1
    - test -f policies/admission/require-readonly-rootfs.yaml || exit 1
    - echo "kyverno policies validation ok"
  tags:
    - SAK5
  only:
    - main

trivy-scan-manifests:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "=== trivy scan manifests ==="
    - trivy config lab/ --severity HIGH,CRITICAL --exit-code 0
    - echo "trivy manifest scan ok"
  tags:
    - SAK5
  only:
    - main

trivy-scan-images:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "=== trivy scan images ==="
    - trivy image --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/orders-api:1.0.0" --exit-code 0
    - trivy image --severity HIGH,CRITICAL rabbitmq:3.12-management --exit-code 0
    - echo "trivy image scan ok"
  tags:
    - SAK5
  only:
    - main

sign-image:
  stage: security-scan
  image:
    name: ghcr.io/sigstore/cosign/cosign:v2.2.3
    entrypoint: [""]
  script:
    - echo "=== signing image ==="
    - echo "$COSIGN_KEY" > cosign.key
    - echo "$COSIGN_PASSWORD" | cosign sign --key cosign.key "$CI_REGISTRY_IMAGE/orders-api:1.0.0"
  tags:
    - SAK5
  only:
    - main


verify-signature:
  stage: test
  image:
    name: ghcr.io/sigstore/cosign/cosign:v2.2.3
    entrypoint: [""]
  script:
    - echo "=== verifying signature ==="
    - echo "$COSIGN_PUB" > cosign.pub
    - cosign verify --key cosign.pub "$CI_REGISTRY_IMAGE/orders-api:1.0.0"
  tags:
    - SAK5
  only:
    - main

policy-tests:
  stage: test
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl kubectl
  script:
    - echo "=== policy tests ==="
    - echo "applying test-policy-violations.yaml"
    - kubectl apply -f tests/kyverno/test-policy-violations.yaml || echo "expected failures"
    - echo "checking deny events"
    - kubectl get events -n app | grep -i denied || echo "no deny events found"
    - echo "policy tests ok"
  tags:
    - SAK5
  only:
    - main