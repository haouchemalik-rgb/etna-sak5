stages:
  - validate
  - security-scan

validate-manifests:
  stage: validate
  image: alpine:3.19
  script:
    - echo "=== validate manifests ==="
    - echo "checking directories"
    - test -d lab/a-admission || (echo "missing directory lab/a-admission" && exit 1)
    - test -d lab/d-messaging || (echo "missing directory lab/d-messaging" && exit 1)
    - test -d policies/admission || (echo "missing directory policies/admission" && exit 1)
    - echo "checking files"
    - test -f lab/d-messaging/rabbitmq.yaml || (echo "missing rabbitmq.yaml" && exit 1)
    - test -f lab/a-admission/orders-api-worker.yaml || (echo "missing orders-api-worker.yaml" && exit 1)
    - echo "manifests validation ok"
  only:
    - main
    - master
  tags:
    - SAK5

validate-scripts:
  stage: validate
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash
  script:
    - echo "=== validate scripts ==="
    - echo "checking bash syntax"
    - bash -n scripts/*.sh || (echo "script syntax error" && exit 1)
    - echo "scripts validation ok"
  only:
    - main
    - master
  tags:
    - SAK5

validate-kyverno-policies:
  stage: validate
  image: alpine:3.19
  script:
    - echo "=== validate kyverno policies ==="
    - echo "checking policy files"
    - test -f policies/admission/deny-privileged.yaml || (echo "missing deny-privileged.yaml" && exit 1)
    - test -f policies/admission/deny-hostpath.yaml || (echo "missing deny-hostpath.yaml" && exit 1)
    - test -f policies/admission/require-readonly-rootfs.yaml || (echo "missing require-readonly-rootfs.yaml" && exit 1)
    - test -f policies/admission/deny-latest-tag.yaml || (echo "missing deny-latest-tag.yaml" && exit 1)
    - echo "kyverno policies validation ok"
  only:
    - main
    - master
  tags:
    - SAK5

trivy-scan-manifests:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "=== trivy scan manifests ==="
    - echo "running trivy config scan"
    - trivy config lab/ --severity HIGH,CRITICAL --exit-code 0
    - echo "trivy manifest scan ok"
  only:
    - main
    - master
  tags:
    - SAK5

trivy-scan-images:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "=== trivy scan images ==="
    - echo "scanning python:3.11-slim"
    - trivy image --severity HIGH,CRITICAL python:3.11-slim --exit-code 0
    - echo "scanning rabbitmq:3.12-management"
    - trivy image --severity HIGH,CRITICAL rabbitmq:3.12-management --exit-code 0
    - echo "trivy image scan ok"
  only:
    - main
    - master
  tags:
    - SAK5