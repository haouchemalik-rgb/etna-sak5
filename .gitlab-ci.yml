trivy-scan-images:
  stage: security-scan
  image: aquasec/trivy:latest
  script:
    - echo "Scan de securite des images Docker"
    - trivy image --severity HIGH,CRITICAL python:3.11-slim --exit-code 0
    - trivy image --severity HIGH,CRITICAL rabbitmq:3.12-management --exit-code 0
    - echo "Scan des images termine"
    - echo "Note: --exit-code 0 pour ne pas bloquer (mode audit)"
    - echo "En production, utiliser --exit-code 1 pour bloquer les deploiements"
  only:
    - main
    - master
  tags:
    - docker
