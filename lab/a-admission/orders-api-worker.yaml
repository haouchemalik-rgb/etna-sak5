apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: app
data:
  RABBITMQ_URL: "amqp://admin:admin@rabbitmq.messaging.svc.cluster.local:5672/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --user --no-cache-dir pika flask;
            python -c '
            from flask import Flask, request
            import pika, os, json
            app = Flask(__name__)
            @app.route("/order", methods=["POST"])
            def create_order():
                conn = pika.BlockingConnection(pika.URLParameters(os.getenv("RABBITMQ_URL")))
                ch = conn.channel()
                ch.queue_declare(queue="orders.q", durable=True)
                ch.basic_publish(exchange="", routing_key="orders.q", body=json.dumps(request.json))
                conn.close()
                return {"status": "sent"}, 201
            @app.route("/health")
            def health():
                return {"status": "ok"}
            app.run(host="0.0.0.0", port=8080)
            '
        env:
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_URL
        - name: PYTHONUSERBASE
          value: "/tmp/.local"
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: app
spec:
  selector:
    app: orders-api
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --user --no-cache-dir pika;
            python -c '
            import pika, os, time, json
            def callback(ch, method, props, body):
                print(f"Received: {body}")
                time.sleep(1)
                ch.basic_ack(delivery_tag=method.delivery_tag)
            conn = pika.BlockingConnection(pika.URLParameters(os.getenv("RABBITMQ_URL")))
            ch = conn.channel()
            ch.queue_declare(queue="orders.q", durable=True)
            ch.basic_consume(queue="orders.q", on_message_callback=callback)
            print("Worker started, waiting for messages...")
            ch.start_consuming()
            '
        env:
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_URL
        - name: PYTHONUSERBASE
          value: "/tmp/.local"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      volumes:
      - name: tmp
        emptyDir: {}
